name: verify

on:
  push:
    # A pull_request run already covers every branch that has a PR, so an
    # unfiltered push trigger ran the identical commit twice. Keep push for the
    # integration branch only: that is the run that checks main after a merge.
    branches: [main]
  pull_request:

jobs:
  verify:
    # Both PowerShell hosts run the same gate. The gate is built for that: its
    # Read-GateText helper and the "file read names its encoding" step exist
    # because Windows PowerShell 5.1 decodes BOM-less UTF-8 with the ANSI code
    # page while pwsh 7 defaults to UTF-8, so a negative assertion can pass on
    # one host and fail on the other. Running only pwsh left that blind spot
    # uncovered in CI while every local run exercised both.
    #
    # The shell keyword accepts no matrix context (an expression there makes the
    # whole file invalid and the run silently does nothing), so each step keeps a
    # literal shell and the matrix names the host to invoke as a child process.
    # The gate still runs under the host the matrix names; only the wrapper that
    # launches it is fixed.
    name: verify (${{ matrix.host }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        host: [pwsh, powershell]
    # GOTOOLCHAIN lives at job level, not on the setup-go step: a step-level
    # env: reaches only that step's process, and the gate runs in later steps.
    # Run 53 proved it - setup-go downloaded go1.27.2 and `go version` reported
    # it, while the gate's `go env GOVERSION` still saw the image's preinstalled
    # go1.27.3. The runner image can drift ahead of go.mod's pin at any time;
    # the coverage floors are only thresholds for the compiler that measured
    # them, so every go command in every step must use the pinned release.
    env:
      GOTOOLCHAIN: go1.27.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read the pin from go.mod rather than floating a version spec: the
          # gate's coverage floors are measured off `go test -cover`, and Go's
          # statement instrumenter changes between patch releases (internal/trust
          # measured 45.8% on go1.27.0 and 34.5% on go1.27.2 with no source
          # change). A floating spec would install a compiler whose verdict the
          # downloaded floors were never measured against. setup-go takes the
          # toolchain directive when go.mod has one.
          go-version-file: go.mod
          cache: false
          # The module carries one dependency (mygo, for internal/gui); the
          # gate's `go build ./...` fetches it through the module proxy as
          # usual. Build caching stays off to keep every run from-image.
      - name: Report Go and host versions
        shell: pwsh
        # The gate has its own step asserting the running toolchain matches the
        # pin; this only makes the run's environment readable from the log. The
        # host is invoked as a child process because `shell:` cannot take a
        # matrix expression.
        run: |
          & go version
          & ${{ matrix.host }} -NoProfile -Command $PSVersionTable.PSVersion.ToString()
      - name: Run offline verification
        shell: pwsh
        # The gate's own output is the diagnosis: every failing Assert-Step prints
        # the step name and the reason before the script exits 1. Job logs need
        # an admin token to download, but the step summary is readable through
        # the public API, so the tail of the run lands there on failure.
        run: |
          $out = & ${{ matrix.host }} -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify.ps1 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $tail = ($out | Select-Object -Last 60) -join "`n"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### verify failed (${{ matrix.host }})`n``````text`n$tail`n``````"
          }
          exit $LASTEXITCODE
