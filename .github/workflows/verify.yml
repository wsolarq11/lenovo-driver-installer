name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.4
          cache: true
      - name: Run offline verification
        shell: pwsh
        run: ./scripts/verify.ps1
