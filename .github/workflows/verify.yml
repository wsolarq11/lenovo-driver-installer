name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache: false
          # Stdlib-only module (go.mod has no requires, hence no go.sum).
          # setup-go defaults cache to true, which would emit a misleading
          # "go.sum not found" warning; disable it explicitly.
      - name: Lock toolchain to go.mod
        shell: pwsh
        run: |
          echo "GOTOOLCHAIN=local" >> $env:GITHUB_ENV
      - name: Run offline verification
        shell: pwsh
        run: ./scripts/verify.ps1
